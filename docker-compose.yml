services:
  db:
    image: mysql:8.4
    container_name: energia-renovavel-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  app:
    build: .
    container_name: energia-renovavel-api
    restart: unless-stopped
    environment:
      PORT: ${PORT:-3000}
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      ADMIN_NOME: ${ADMIN_NOME:-Administrador}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_SENHA: ${ADMIN_SENHA}
      PESQUISADOR_NOME: ${PESQUISADOR_NOME:-Pesquisador}
      PESQUISADOR_EMAIL: ${PESQUISADOR_EMAIL:-}
      PESQUISADOR_SENHA: ${PESQUISADOR_SENHA:-}
      GESTOR_NOME: ${GESTOR_NOME:-Gestor Público}
      GESTOR_EMAIL: ${GESTOR_EMAIL:-}
      GESTOR_SENHA: ${GESTOR_SENHA:-}
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
